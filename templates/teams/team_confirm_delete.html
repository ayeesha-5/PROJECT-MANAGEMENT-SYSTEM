<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Team - PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body{background:#f4f6fb;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
        .modal-card{background:#fff;border-radius:16px;border:1px solid #f0f0f0;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:36px;width:100%;max-width:420px;text-align:center}
        .modal-icon{width:64px;height:64px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 20px}
        h4{margin:0 0 8px;font-weight:700;color:#1a1a2e}
        .subtitle{margin:0 0 20px;font-size:.88rem;color:#6b7280;line-height:1.5}
        .team-chip{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 16px;font-size:.88rem;color:#dc2626;font-weight:600;margin-bottom:24px;display:inline-block}
        .btn-row{display:flex;gap:10px}
        .btn-del{background:#dc2626;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;flex:1}
        .btn-del:hover{background:#b91c1c}
        .btn-cancel{background:#f3f4f6;color:#374151;border:none;padding:10px 24px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;flex:1}
        .btn-cancel:hover{background:#e5e7eb;color:#374151}
    </style>
</head>
<body>
    <div class="modal-card">
        <div class="modal-icon"><i class="fas fa-trash"></i></div>
        <h4>Delete Team?</h4>
        <p class="subtitle">This action cannot be undone. All team member assignments will be removed.</p>
        <div class="team-chip"><i class="fas fa-users me-1"></i>{{ team.team_name }}</div>
        <form method="POST">
            {% csrf_token %}
            <div class="btn-row">
                <button type="submit" class="btn-del"><i class="fas fa-trash me-1"></i>Yes, Delete</button>
                <a href="{% url 'team_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
