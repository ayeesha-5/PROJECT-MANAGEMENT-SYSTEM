<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Status - PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body{background:#f4f6fb;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
        .modal-card{background:#fff;border-radius:16px;border:1px solid #f0f0f0;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:36px;width:100%;max-width:440px}
        .modal-icon{width:56px;height:56px;border-radius:14px;background:#e0f2fe;color:#0284c7;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:16px}
        h4{margin:0 0 4px;font-weight:700;color:#1a1a2e}
        p{margin:0 0 20px;font-size:.85rem;color:#6b7280}
        .form-label{font-size:.82rem;font-weight:600;color:#374151;margin-bottom:5px;display:block}
        .form-select{border:1px solid #e8ecf0;border-radius:8px;padding:10px 12px;font-size:.88rem;color:#374151;outline:none;width:100%}
        .form-select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
        .task-chip{background:#f0efff;border-radius:8px;padding:8px 14px;font-size:.85rem;color:#4f46e5;font-weight:600;margin-bottom:20px;display:inline-block}
        .btn-row{display:flex;gap:10px;margin-top:24px}
        .btn-confirm{background:#4f46e5;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;flex:1}
        .btn-confirm:hover{background:#4338ca}
        .btn-cancel{background:#f3f4f6;color:#374151;border:none;padding:10px 24px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;flex:1}
        .btn-cancel:hover{background:#e5e7eb;color:#374151}
    </style>
</head>
<body>
    <div class="modal-card">
        <div class="modal-icon"><i class="fas fa-sync-alt"></i></div>
        <h4>Update Task Status</h4>
        <p>Change the current status of this task.</p>
        <div class="task-chip"><i class="fas fa-check-square me-1"></i>{{ task.task_name }}</div>

        <form method="POST">
            {% csrf_token %}
            <label class="form-label">New Status</label>
            <select name="status" class="form-select">
                <option value="pending" {% if task.status == 'pending' %}selected{% endif %}>⏳ Pending</option>
                <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>🔄 In Progress</option>
                <option value="testing" {% if task.status == 'testing' %}selected{% endif %}>🧪 Testing</option>
                <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>✅ Completed</option>
            </select>
            <div class="btn-row">
                <button type="submit" class="btn-confirm"><i class="fas fa-check me-1"></i>Update</button>
                <a href="{% url 'task_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
