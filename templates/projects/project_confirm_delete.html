<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Project - PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background: #f4f6fb; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .delete-card { background: white; border-radius: 16px; border: 1px solid #f0f0f0; box-shadow: 0 8px 32px rgba(0,0,0,0.1); padding: 40px; max-width: 420px; width: 100%; text-align: center; }
        .delete-icon { width: 72px; height: 72px; background: #fee2e2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.8rem; color: #dc2626; }
        .delete-card h4 { font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
        .delete-card p { color: #6b7280; font-size: 0.9rem; margin-bottom: 6px; }
        .project-name { font-weight: 700; color: #1a1a2e; font-size: 1rem; background: #f9fafb; padding: 10px 16px; border-radius: 8px; margin: 14px 0 20px; border: 1px solid #f0f0f0; }
        .warning-text { font-size: 0.8rem; color: #ef4444; background: #fef2f2; padding: 8px 14px; border-radius: 8px; margin-bottom: 24px; }
        .btn-confirm { background: #dc2626; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-confirm:hover { background: #b91c1c; }
        .btn-cancel-link { background: #f3f4f6; color: #6b7280; padding: 10px 24px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .btn-cancel-link:hover { background: #e5e7eb; color: #374151; }
    </style>
</head>
<body>
    <div class="delete-card">
        <div class="delete-icon"><i class="fas fa-trash-alt"></i></div>
        <h4>Delete Project?</h4>
        <p>You are about to permanently delete:</p>
        <div class="project-name">{{ project.name }}</div>
        <div class="warning-text">
            <i class="fas fa-exclamation-triangle me-1"></i>
            This will also delete all tasks, files, and team data linked to this project. This action cannot be undone!
        </div>
        <form method="POST">
            {% csrf_token %}
            <div style="display:flex;gap:12px;justify-content:center;">
                <a href="{% url 'project_list' %}" class="btn-cancel-link">Cancel</a>
                <button type="submit" class="btn-confirm"><i class="fas fa-trash me-1"></i> Yes, Delete</button>
            </div>
        </form>
    </div>
</body>
</html>
